<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Elo - Ansh Aggarwal</title>
  <link rel="stylesheet" href="../style.css">
  <link rel="icon" type="image/gif" href="../media/badApple.gif">
  <style>
    .meta {
      color: #999;
      font-size: 0.85rem;
    }

    .toggle {
      margin: 1rem 0 0.5rem;
      font-size: 0.9rem;
    }

    .toggle.leagues {
      margin-top: 0;
      font-size: 1rem;
    }

    .toggle button {
      font: inherit;
      background: none;
      border: none;
      padding: 0;
      margin-right: 1.25rem;
      color: #ccc;
      cursor: pointer;
    }

    .toggle button:hover,
    .toggle button.active {
      color: #32CD32;
    }

    table.elo {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.9rem;
    }

    table.elo th {
      white-space: nowrap;
      color: #999;
      font-weight: 400;
      text-align: left;
      border-bottom: 1px solid #444;
      padding: 0.3rem 0.4rem;
    }

    table.elo th.sortable {
      position: relative;
      cursor: pointer;
      user-select: none;
    }

    table.elo th.sortable:hover {
      color: #e0e0e0;
    }

    table.elo th.sorted {
      color: #32CD32;
    }

    /* sort indicator: a small square, which becomes a triangle on the sorted column */
    table.elo th .ind {
      display: inline-block;
      width: 0.4rem;
      height: 0.4rem;
      margin-left: 0.35rem;
      vertical-align: 0.1rem;
      background: #555;
    }

    table.elo th.sortable:hover .ind {
      background: #999;
    }

    table.elo th.sorted .ind,
    table.elo th.sorted:hover .ind {
      width: 0;
      height: 0;
      background: none;
      border-left: 0.2rem solid transparent;
      border-right: 0.2rem solid transparent;
      border-top: 0.4rem solid #32CD32;
    }

    table.elo th.sorted.asc .ind {
      border-top: 0;
      border-bottom: 0.4rem solid #32CD32;
    }

    table.elo th.sortable:focus-visible {
      outline: 1px solid #32CD32;
    }

    /* instant explanation on hover / keyboard focus */
    table.elo th[data-tip]:hover::after,
    table.elo th[data-tip]:focus-visible::after,
    table.elo td [data-tip]:hover::after {
      content: attr(data-tip);
      position: absolute;
      top: calc(100% + 4px);
      right: 0;
      z-index: 5;
      width: 15rem;
      white-space: normal;
      text-align: left;
      font-size: 0.75rem;
      line-height: 1.4;
      color: #e0e0e0;
      background: #111;
      border: 1px solid #333;
      padding: 0.3rem 0.5rem;
    }

    table.elo th.tip-left::after,
    table.elo td [data-tip]::after {
      right: auto !important;
      left: 0;
    }

    /* clinch letter beside the team name, explained in the key under the table */
    .clinch {
      position: relative;
      font-size: 0.7rem;
      margin-left: 0.3rem;
      color: #999;
    }

    table.elo td.move {
      font-size: 0.75rem;
      width: 2rem;
    }

    .clinch-key {
      font-size: 0.75rem;
      color: #999;
      margin: 0.6rem 0 0;
    }

    .clinch-key > span {
      margin-right: 1.25rem;
      white-space: nowrap;
    }

    .clinch-key .clinch {
      margin-left: 0;
      margin-right: 0.3rem;
      color: #e0e0e0;
    }

    table.elo .lbl-short { display: none; } /* shorter header words on phones */

    /* columns that drop out on narrow screens; anything still too wide scrolls sideways */
    #tables { overflow-x: auto; }

    @media (max-width: 640px) {
      table.elo .opt { display: none; }
      table.elo { font-size: 0.8rem; }
      table.elo th, table.elo td { padding-left: 0.25rem; padding-right: 0.25rem; }
      table.elo th:not(.sorted) .ind { display: none; } /* only the sorted column keeps its marker */
      table.elo .swatch { margin-right: 0.4rem; }
      table.elo .rank { width: 1.3rem; }
      table.elo .lbl-long { display: none; }
      table.elo .lbl-short { display: inline; }
      #views button.aside { margin-left: 0; padding-left: 0; border-left: none; }
      .timeline { flex-wrap: wrap; }
    }

    table.elo td {
      padding: 0.25rem 0.4rem;
      border-bottom: 1px dotted #333;
      white-space: nowrap;
    }

    table.elo .num {
      text-align: right;
      font-variant-numeric: tabular-nums;
    }

    table.elo .rank {
      color: #777;
      width: 2rem;
    }

    .swatch {
      display: inline-block;
      width: 0.7rem;
      height: 0.7rem;
      margin-right: 0.6rem;
      vertical-align: -0.05rem;
      border-bottom: 3px solid transparent; /* accent colour set inline */
      flex-shrink: 0;
    }

    tr.team {
      cursor: pointer;
    }

    tr.team:hover td,
    tr.team.open td {
      color: #fff;
    }

    tr.team:focus-visible {
      outline: 1px solid #32CD32;
    }

    tr.hist td {
      padding: 0.4rem 0.4rem 0.9rem;
      border-bottom: 1px dotted #333;
      white-space: normal;
    }

    .chart {
      position: relative;
    }

    .chart svg {
      display: block;
      width: 100%;
      height: auto;
      overflow: visible;
    }

    .chart .line {
      fill: none;
      stroke: #32CD32;
      stroke-width: 2;
      stroke-linejoin: round;
      stroke-linecap: round;
    }

    .chart .ref {
      stroke: #555;
      stroke-dasharray: 3 3;
    }

    .chart .sep {
      stroke: #444;
    }

    .chart .cross {
      stroke: #666;
    }

    .chart .dot {
      fill: #32CD32;
      stroke: #1a1a1a;
      stroke-width: 2;
    }

    /* uncertainty band: one standard error either side of the rating */
    .chart .band { fill: #32CD32; opacity: 0.12; }
    .chart .band.a { fill: #29a829; }
    .chart .band.b { fill: #4a8fd6; }

    /* hover explanations inside the team panel */
    .panel-meta [data-tip] {
      position: relative;
      cursor: help;
      border-bottom: 1px dotted #555;
    }

    /* comparing two teams: a validated green/blue pair, with a legend and labelled ends */
    .chart .line.a { stroke: #29a829; }
    .chart .line.b { stroke: #4a8fd6; }
    .chart .dot.a { fill: #29a829; }
    .chart .dot.b { fill: #4a8fd6; }

    .panel-meta {
      color: #999;
      font-size: 0.8rem;
      margin-bottom: 0.4rem;
    }

    .panel-meta select {
      font: inherit;
      color: #e0e0e0;
      background: #111;
      border: 1px solid #333;
      padding: 0 0.2rem;
      margin-left: 0.3rem;
    }

    .legend {
      font-size: 0.8rem;
      color: #ccc;
      margin-bottom: 0.3rem;
    }

    .legend .key {
      margin-right: 1rem;
    }

    .legend i {
      display: inline-block;
      width: 1rem;
      height: 2px;
      margin-right: 0.4rem;
      vertical-align: 0.25rem;
    }

    .legend i.a { background: #29a829; }
    .legend i.b { background: #4a8fd6; }

    .h2h {
      margin: 0.4rem 0 0;
    }

    .gotw {
      margin: 0 0 0.6rem;
      font-size: 0.85rem;
      color: #e0e0e0;
    }

    .chart .hit {
      fill: transparent;
      cursor: crosshair;
    }

    .chart text {
      font-family: 'Fira Code', monospace;
      font-size: 11px;
    }

    .chart .axis { fill: #777; }
    .chart .val { fill: #e0e0e0; }

    .chart .tip {
      position: absolute;
      pointer-events: none;
      background: #111;
      border: 1px solid #333;
      padding: 0.3rem 0.5rem;
      font-size: 0.75rem;
      line-height: 1.4;
      color: #e0e0e0;
      white-space: nowrap;
    }

    .up-txt { color: #32CD32; }
    .down-txt { color: #c0504d; }
    .flat-txt { color: #777; }

    h3 {
      font-size: 1rem;
      color: #ccc;
      font-weight: 500;
      margin: 1.75rem 0 0.4rem;
    }

    .games {
      list-style: none;
      padding: 0;
      margin: 0;
      font-size: 0.85rem;
      color: #bbb;
    }

    .games li {
      margin-bottom: 0.3rem;
    }

    /* bracket: one column per round, each series centred on the rows of the series that fed it */
    .bracket-wrap {
      overflow-x: auto;
    }

    .bracket {
      display: grid;
      column-gap: 1rem;
      row-gap: 0.4rem;
      font-size: 0.8rem;
      min-width: max-content;
    }

    .bracket .round {
      color: #999;
      border-bottom: 1px solid #444;
      padding-bottom: 0.2rem;
      margin-bottom: 0.2rem;
    }

    .series {
      align-self: center;
      border-left: 1px solid #444;
      padding: 0.15rem 0 0.15rem 0.5rem;
      min-width: 9rem;
    }

    .series .side {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      white-space: nowrap;
    }

    .series .side .swatch {
      margin-right: 0;
    }

    .series .side .name {
      flex: 1;
    }

    .series .side .w {
      color: #999;
      font-variant-numeric: tabular-nums;
    }

    .series .side.won,
    .series .side.won .w {
      color: #32CD32;
    }

    .series .side.lost {
      color: #666;
    }

    .series .side.lost .w {
      color: #555;
    }

    #bracket:not(:empty) {
      margin-bottom: 2.5rem;
    }

    button.more {
      font: inherit;
      font-size: 0.85rem;
      background: none;
      border: none;
      padding: 0;
      margin-top: 0.6rem;
      color: #ccc;
      cursor: pointer;
    }

    button.more:hover {
      color: #32CD32;
    }

    /* the hidden attribute always wins over display rules below */
    [hidden] { display: none !important; }

    /* "more stats" sits apart from the view buttons */
    .toggle button.aside {
      margin-left: 1rem;
      padding-left: 1.25rem;
      border-left: 1px solid #444;
    }

    /* time machine: a hairline track with a square thumb, stepped with ‹ › */
    .timeline {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      margin: -0.1rem 0 1rem;
      font-size: 0.85rem;
    }

    .timeline button {
      font: inherit;
      background: none;
      border: none;
      padding: 0 0.15rem;
      color: #999;
      cursor: pointer;
    }

    .timeline button:hover:not(:disabled) { color: #32CD32; }
    .timeline button:disabled { color: #444; cursor: default; }

    .timeline input[type="range"] {
      -webkit-appearance: none;
      appearance: none;
      flex: 1;
      max-width: 16rem;
      height: 14px;
      margin: 0;
      cursor: pointer;
      background:
        linear-gradient(#32CD32, #32CD32) 0 50% / var(--fill, 100%) 1px no-repeat,
        linear-gradient(#444, #444) 0 50% / 100% 1px no-repeat;
    }

    .timeline input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 0.55rem;
      height: 0.55rem;
      background: #32CD32;
      border: none;
      border-radius: 0;
    }

    .timeline input[type="range"]::-moz-range-thumb {
      width: 0.55rem;
      height: 0.55rem;
      background: #32CD32;
      border: none;
      border-radius: 0;
    }

    .timeline input[type="range"]::-moz-range-track { background: transparent; }
    .timeline input[type="range"]:focus-visible { outline: 1px solid #32CD32; outline-offset: 3px; }

    #tm-label { white-space: nowrap; }
    #tm-now::before { content: '· '; color: #555; }

    /* game lists: date · matchup · note, in aligned columns */
    .games li {
      display: grid;
      grid-template-columns: 3.6rem 1fr auto;
      column-gap: 0.75rem;
      align-items: baseline;
    }

    .games .sub {
      color: #999;
      text-align: right;
      white-space: nowrap;
    }

    .games li > .sub:first-child { text-align: left; } /* the date */

    .games .line { color: #666; }

    .gotw-label {
      font-size: 0.75rem;
      color: #777;
      margin: 0 0 0.1rem;
    }

    .games.gotw { margin-bottom: 0.7rem; }
    .games.gotw li { color: #e0e0e0; }

    /* team panel: facts, controls, chart, then resume and schedule side by side */
    .panel-meta + .panel-meta { margin-top: -0.2rem; }

    .panel-cols {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.4rem 1.5rem;
      margin-top: 0.6rem;
      font-size: 0.8rem;
      color: #bbb;
    }

    .panel-cols h4 {
      margin: 0 0 0.2rem;
      font-size: 0.75rem;
      font-weight: 400;
      color: #777;
    }

    .panel-cols ul { list-style: none; margin: 0; padding: 0; }
    .panel-cols li { margin-bottom: 0.15rem; white-space: nowrap; }
    .panel-cols .swatch { margin-right: 0.35rem; }
    .panel-cols .sub { color: #999; }

    @media (max-width: 640px) {
      .panel-cols { grid-template-columns: 1fr; }
      .games li { grid-template-columns: 3.2rem 1fr; }
      .games .sub { grid-column: 2; text-align: left; }
    }

    .note {
      color: #999;
      font-size: 0.85rem;
      font-style: italic;
      border-left: 2px solid #444;
      padding-left: 0.75rem;
      margin: 2.5rem 0 1rem;
    }

  </style>
</head>
<body>
  <header>
    <h1><a href="../index.html">Ansh Aggarwal</a></h1>
    <nav>
      <a href="../index.html">Home</a>
      <a href="../research.html">Research</a>
      <a href="../mcidasv.html">McIDAS-V</a>
      <a href="../writing/index.html">Writing</a>
    </nav>
  </header>

  <main>
    <div class="toggle leagues" id="leagues">
      <button data-league="nfl">NFL</button>
      <button data-league="nba">NBA</button>
      <button data-league="nhl">NHL</button>
      <button data-league="mlb">MLB</button>
      <button data-league="wnba">WNBA</button>
      <button data-league="cfb">CFB</button>
    </div>

    <h2 id="title">Elo</h2>
    <p class="meta" id="status">fetching games ...</p>

    <div id="bracket"></div>

    <div class="toggle" id="views" hidden>
      <button data-view="ranked" class="active">ranked</button>
      <button data-view="division">by division</button>
      <button id="more-stats" class="aside">more stats</button>
    </div>

    <div class="timeline" id="timeline" hidden>
      <button id="tm-prev" aria-label="previous week">‹</button>
      <input type="range" id="tm" min="0" max="0" value="0" aria-label="show the table as it stood after a given week">
      <button id="tm-next" aria-label="next week">›</button>
      <span class="meta" id="tm-label"></span>
      <button id="tm-now" hidden>now</button>
    </div>

    <div id="tables"></div>

    <div id="recent"></div>

    <p class="note">Data from ESPN.</p>
  </main>

  <script src="elo.js"></script>
</body>
</html>
