<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Elo - Ansh Aggarwal</title>
  <link rel="stylesheet" href="../style.css">
  <link rel="icon" type="image/gif" href="../media/badApple.gif">
  <style>
    .meta {
      color: #999;
      font-size: 0.85rem;
    }

    .toggle {
      margin: 1rem 0 0.5rem;
      font-size: 0.9rem;
    }

    .toggle.leagues {
      margin-top: 0;
      font-size: 1rem;
    }

    .toggle button {
      font: inherit;
      background: none;
      border: none;
      padding: 0;
      margin-right: 1.25rem;
      color: #ccc;
      cursor: pointer;
    }

    .toggle button:hover,
    .toggle button.active {
      color: #32CD32;
    }

    table.elo {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.9rem;
    }

    table.elo th {
      color: #999;
      font-weight: 400;
      text-align: left;
      border-bottom: 1px solid #444;
      padding: 0.3rem 0.4rem;
    }

    table.elo td {
      padding: 0.25rem 0.4rem;
      border-bottom: 1px dotted #333;
      white-space: nowrap;
    }

    table.elo .num {
      text-align: right;
      font-variant-numeric: tabular-nums;
    }

    table.elo .rank {
      color: #777;
      width: 2rem;
    }

    .swatch {
      display: inline-block;
      width: 0.7rem;
      height: 0.7rem;
      margin-right: 0.6rem;
      vertical-align: -0.05rem;
      border-bottom: 3px solid transparent; /* accent colour set inline */
      flex-shrink: 0;
    }

    tr.team {
      cursor: pointer;
    }

    tr.team:hover td,
    tr.team.open td {
      color: #fff;
    }

    tr.team:focus-visible {
      outline: 1px solid #32CD32;
    }

    tr.hist td {
      padding: 0.4rem 0.4rem 0.9rem;
      border-bottom: 1px dotted #333;
      white-space: normal;
    }

    .chart {
      position: relative;
    }

    .chart svg {
      display: block;
      width: 100%;
      height: auto;
      overflow: visible;
    }

    .chart .line {
      fill: none;
      stroke: #32CD32;
      stroke-width: 2;
      stroke-linejoin: round;
      stroke-linecap: round;
    }

    .chart .ref {
      stroke: #555;
      stroke-dasharray: 3 3;
    }

    .chart .sep {
      stroke: #444;
    }

    .chart .cross {
      stroke: #666;
    }

    .chart .dot {
      fill: #32CD32;
      stroke: #1a1a1a;
      stroke-width: 2;
    }

    .chart .hit {
      fill: transparent;
      cursor: crosshair;
    }

    .chart text {
      font-family: 'Fira Code', monospace;
      font-size: 11px;
    }

    .chart .axis { fill: #777; }
    .chart .val { fill: #e0e0e0; }

    .chart .tip {
      position: absolute;
      pointer-events: none;
      background: #111;
      border: 1px solid #333;
      padding: 0.3rem 0.5rem;
      font-size: 0.75rem;
      line-height: 1.4;
      color: #e0e0e0;
      white-space: nowrap;
    }

    .bar-cell {
      width: 30%;
    }

    .bar {
      position: relative;
      height: 0.5rem;
    }

    .bar::before {
      /* the 1600 baseline */
      content: "";
      position: absolute;
      left: 50%;
      top: -0.2rem;
      bottom: -0.2rem;
      border-left: 1px solid #555;
    }

    .bar span {
      position: absolute;
      top: 0;
      bottom: 0;
    }

    .bar .up { background: #32CD32; }
    .bar .down { background: #777; }

    .up-txt { color: #32CD32; }
    .down-txt { color: #c0504d; }
    .flat-txt { color: #777; }

    h3 {
      font-size: 1rem;
      color: #ccc;
      font-weight: 500;
      margin: 1.75rem 0 0.4rem;
    }

    .games {
      list-style: none;
      padding: 0;
      margin: 0;
      font-size: 0.85rem;
      color: #bbb;
    }

    .games li {
      margin-bottom: 0.3rem;
    }

    /* bracket: one column per round, each series centred on the rows of the series that fed it */
    .bracket-wrap {
      overflow-x: auto;
    }

    .bracket {
      display: grid;
      column-gap: 1rem;
      row-gap: 0.4rem;
      font-size: 0.8rem;
      min-width: max-content;
    }

    .bracket .round {
      color: #999;
      border-bottom: 1px solid #444;
      padding-bottom: 0.2rem;
      margin-bottom: 0.2rem;
    }

    .series {
      align-self: center;
      border-left: 1px solid #444;
      padding: 0.15rem 0 0.15rem 0.5rem;
      min-width: 9rem;
    }

    .series .side {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      white-space: nowrap;
    }

    .series .side .swatch {
      margin-right: 0;
    }

    .series .side .name {
      flex: 1;
    }

    .series .side .w {
      color: #999;
      font-variant-numeric: tabular-nums;
    }

    .series .side.won,
    .series .side.won .w {
      color: #32CD32;
    }

    .series .side.lost {
      color: #666;
    }

    .series .side.lost .w {
      color: #555;
    }

    #bracket:not(:empty) {
      margin-bottom: 2.5rem;
    }

    .note {
      color: #999;
      font-size: 0.85rem;
      font-style: italic;
      border-left: 2px solid #444;
      padding-left: 0.75rem;
      margin: 2.5rem 0 1rem;
    }

    @media (max-width: 600px) {
      .bar-cell { display: none; }
    }
  </style>
</head>
<body>
  <header>
    <h1><a href="../index.html">Ansh Aggarwal</a></h1>
    <nav>
      <a href="../index.html">Home</a>
      <a href="../research.html">Research</a>
      <a href="../mcidasv.html">McIDAS-V</a>
      <a href="../writing/index.html">Writing</a>
    </nav>
  </header>

  <main>
    <div class="toggle leagues" id="leagues">
      <button data-league="nfl">NFL</button>
      <button data-league="nba">NBA</button>
      <button data-league="nhl">NHL</button>
      <button data-league="mlb">MLB</button>
    </div>

    <h2 id="title">Elo</h2>
    <p class="meta" id="status">fetching games ...</p>

    <div id="bracket"></div>

    <div class="toggle" id="views" hidden>
      <button data-view="ranked" class="active">ranked</button>
      <button data-view="division">by division</button>
    </div>

    <div id="tables"></div>

    <div id="recent"></div>

    <p class="note">Data from ESPN.</p>
  </main>

  <script src="elo.js"></script>
</body>
</html>
